<head>

  <meta name="twitter:title" content="Food-Hunt — Campus Food Discovery at LPU" />
  <meta name="twitter:description" content="Discover campus food vendors, split meals with friends, and save money. The ultimate campus food companion for LPU students." />
  <meta name="twitter:image" content="https://food-hunt.app/og-image.png" />

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Food-Hunt",
    "alternateName": "FoodHunt",
    "url": "https://food-hunt.app",
    "description": "Campus food discovery and meal-splitting platform for LPU students.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://food-hunt.app/vendors?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Food-Hunt",
    "url": "https://food-hunt.app",
    "logo": "https://food-hunt.app/logo.png",
    "sameAs": [
      "https://github.com/justkalesh",
      "https://www.linkedin.com/in/justkalesh/",
      "https://www.instagram.com/kalash.who/"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "foodhunt101lpu@gmail.com",
      "contactType": "customer support"
    }
  }
  </script>

  <!-- Supabase Password Recovery detection - works with both BrowserRouter and HashRouter -->
  <script>
    (function () {
      var hash = window.location.hash;
      var search = window.location.search;
      if ((hash && hash.indexOf('type=recovery') !== -1) ||
          (search && search.indexOf('type=recovery') !== -1)) {
        sessionStorage.setItem('supabase_password_recovery', 'true');
      }
    })();
  </script>

  <!-- Instagram/WebView detection - runs FIRST before any external scripts -->
  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera || '';
      window.__isInAppBrowser = /Instagram|FBAN|FBAV|FB_IAB|FB4A|FBIOS/i.test(ua);
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    try {
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Primary: Burnt Orange (appetite/action)
            primary: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              800: '#9a3412',
              900: '#7c2d12',
            },
            // Secondary: Midnight Slate (dark mode depth)
            slate: {
              800: '#1e293b',
              850: '#162032',
              900: '#0f172a',
              950: '#0a101d',
            },
            // Accent colors
            accent: {
              lime: '#a3e635',
              sky: '#0ea5e9',
              success: '#22c55e',
            },
            dark: {
              800: '#1e293b',
              900: '#0f172a',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out forwards',
            'slide-up': 'slideUp 0.4s ease-out forwards',
            'scale-in': 'scaleIn 0.2s ease-out forwards',
            'pulse-subtle': 'pulseSubtle 2s ease-in-out infinite',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            scaleIn: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            pulseSubtle: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.7' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
          },
          backdropBlur: {
            xs: '2px',
          },
          boxShadow: {
            'glow-primary': '0 0 20px rgba(249, 115, 22, 0.3)',
            'glow-accent': '0 0 20px rgba(14, 165, 233, 0.3)',
          },
        }
      }
    }
    } catch(e) {
      // Tailwind CDN failed to load (content blocker, slow network) — app still works
      console.warn('Tailwind CDN not available:', e);
    }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }
  </style>

  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-dark-900 dark:text-gray-100 transition-colors duration-200">
  <!-- Fallback UI for Instagram/Facebook in-app browsers -->
  <div id="fallback"
    style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:white;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:9999;">
    <div
      style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;">
      <img src="/logo.png" alt="Food-Hunt" style="width:80px;height:80px;margin-bottom:24px;border-radius:16px;"
        onerror="this.style.display='none'">
      <h1
        style="font-size:28px;font-weight:700;margin-bottom:12px;background:linear-gradient(90deg,#f97316,#fb923c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">
        Food-Hunt</h1>
      <p style="color:#94a3b8;margin-bottom:24px;max-width:280px;line-height:1.5;">
        Instagram's browser doesn't fully support this app. Please open in your phone's browser.
      </p>

      <!-- Copy Link Button -->
      <button id="copy-link-btn" onclick="copyLink()"
        style="display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#f97316 0%,#ea580c 100%);color:white;padding:16px 32px;border-radius:12px;font-weight:600;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(249,115,22,0.4);font-size:16px;">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="copy-btn-text">Copy Link</span>
      </button>

      <div style="margin-top:32px;padding:20px;background:rgba(255,255,255,0.05);border-radius:12px;max-width:300px;">
        <p style="color:#f97316;font-weight:600;margin-bottom:8px;font-size:14px;">📱 How to open:</p>
        <p style="color:#94a3b8;font-size:13px;line-height:1.6;margin:0;">
          1. Tap <strong style="color:white;">⋯</strong> or <strong style="color:white;">⋮</strong> in the top right<br>
          2. Select "<strong style="color:white;">Open in Browser</strong>"
        </p>
      </div>
    </div>
  </div>

  <script>
    function copyLink() {
      var url = window.location.href;
      var btn = document.getElementById('copy-btn-text');

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () {
          btn.textContent = 'Copied! ✓';
          setTimeout(function () { btn.textContent = 'Copy Link'; }, 2000);
        }).catch(function () {
          fallbackCopy(url, btn);
        });
      } else {
        fallbackCopy(url, btn);
      }
    }

    function fallbackCopy(text, btn) {
      var textArea = document.createElement('textarea');
      textArea.value = text;
      textArea.style.position = 'fixed';
      textArea.style.left = '-999999px';
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        btn.textContent = 'Copied! ✓';
        setTimeout(function () { btn.textContent = 'Copy Link'; }, 2000);
      } catch (err) {
        btn.textContent = 'Copy failed';
      }
      document.body.removeChild(textArea);
    }
  </script>


  <!-- Preloader (lives OUTSIDE #root so React doesn't destroy it on mount) -->
  <div id="app-preloader">
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #0f172a;
        gap: 20px;
        transition: opacity 0.3s ease;
      }
      #app-preloader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .fh-preloader-ring {
        position: relative;
        width: 80px;
        height: 80px;
      }
      .fh-preloader-ring .spinner-ring {
        width: 80px;
        height: 80px;
        border: 4px solid rgba(234, 88, 12, 0.2);
        border-top: 4px solid #ea580c;
        border-radius: 50%;
        animation: fh-spin 0.9s linear infinite;
      }
      .fh-preloader-ring .icon {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .fh-preloader-ring .icon svg {
        width: 32px;
        height: 32px;
        color: #ea580c;
      }
      .fh-preloader-text {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 14px;
        color: #94a3b8;
        font-weight: 500;
        animation: fh-pulse 2s ease-in-out infinite;
      }
      @keyframes fh-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes fh-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
    <div class="fh-preloader-ring">
      <div class="spinner-ring"></div>
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
        </svg>
      </div>
    </div>
    <p class="fh-preloader-text">Discovering campus food spots...</p>
  </div>

  <div id="root"></div>

  <script>
    // Handle Instagram/Facebook in-app browser fallback
    (function () {
      var isInAppBrowser = window.__isInAppBrowser;

      // Set the "Open in Browser" link
      var link = document.getElementById('open-browser-btn');
      if (link) {
        var url = window.location.href;
        link.href = url;
        // For iOS, try to open in Safari
        if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          link.href = 'x-safari-' + url;
        }
      }

      // For Instagram users: show fallback quickly if app doesn't load
      if (isInAppBrowser) {
        var fallbackShown = false;
        var timeout = setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.innerHTML.trim() === '') {
            document.getElementById('fallback').style.display = 'block';
            fallbackShown = true;
          }
        }, 1500); // Show after 1.5 seconds if nothing rendered

        window.__hideFallback = function () {
          clearTimeout(timeout);
          if (fallbackShown) {
            document.getElementById('fallback').style.display = 'none';
          }
        };
      }

      // Global error handler for Instagram
      window.onerror = function (msg) {
        if (isInAppBrowser) {
          document.getElementById('fallback').style.display = 'block';
        }
        return false;
      };
    })();
  </script>

  <script type="module" src="/index.tsx"></script>
</body>

</html>
